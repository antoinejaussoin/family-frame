<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weather icons — dithered</title>
  <style>
    html, body {
      margin: 0;
      background: #ffffff;
      color: #000000;
      font-family: system-ui, sans-serif;
    }
    header {
      box-sizing: border-box;
      padding: 16px 24px 14px;
      border-bottom: 3px solid #000000;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }
    p {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.4;
    }
    a { color: #0000ff; }
    .panel {
      overflow: auto;
      background: #ffffff;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <header>
    <h1>Weather icons, dithered</h1>
    <p>
      Same Chrome screenshot + Floyd–Steinberg path as the panel.
      40px is the dashboard header size. First load waits on Chrome.
      <a href="/weather-icons/sheet">SVG sheet</a> ·
      <a href="/weather-icons/chrome.png">pre-dither PNG</a> ·
      <a href="/weather-icons/dither.png">dithered PNG</a>
    </p>
  </header>
  <div class="panel">
    <img src="/weather-icons/dither.png" width="1600" height="1200" alt="All weather icons after Spectra 6 dither">
  </div>
</body>
</html>
