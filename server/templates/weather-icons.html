<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weather icons</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  <style>
    .sheet {
      box-sizing: border-box;
      width: 1600px;
      height: 1200px;
      padding: 24px 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sheet-title {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }
    .sheet-lede {
      margin: 6px 0 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 4px solid var(--black);
      padding-bottom: 8px;
    }
    .header-label {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex: 0 0 auto;
    }
    .header-row .slots { margin-left: auto; gap: 6px; }
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(3, 1fr);
      gap: 10px 12px;
      flex: 1;
      min-height: 0;
    }
    .cell {
      box-sizing: border-box;
      border: 4px solid var(--black);
      padding: 8px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
    }
    .sizes {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
    }
    .at-40 { width: 40px; height: 40px; display: block; overflow: visible; }
    .at-80 { width: 80px; height: 80px; display: block; overflow: visible; }
    .label {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
    }
    .meta {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      color: var(--red);
    }
  </style>
</head>
<body>
  <svg class="wx-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      {% include "wx-sprite.html" %}
    </defs>
  </svg>
  <main class="sheet">
    <header>
      <p class="sheet-title">Weather icons</p>
      <p class="sheet-lede">40px is the dashboard header size. Chrome raster, then Floyd–Steinberg to Spectra 6.</p>
    </header>
    <div class="header-row">
      <span class="header-label">Header</span>
      <span class="slots">
        {% for icon in icons %}
        <span class="slot">
          <svg class="wx-icon" viewBox="0 0 64 64" aria-hidden="true"><use href="#wx-{{ icon.id }}"/></svg>
        </span>
        {% endfor %}
      </span>
    </div>
    <div class="icon-grid">
      {% for icon in icons %}
      <article class="cell">
        <div class="sizes">
          <svg class="at-80" viewBox="0 0 64 64" aria-hidden="true"><use href="#wx-{{ icon.id }}"/></svg>
          <svg class="at-40" viewBox="0 0 64 64" aria-hidden="true"><use href="#wx-{{ icon.id }}"/></svg>
        </div>
        <p class="label">{{ icon.label }}</p>
        <p class="meta">{{ icon.id }} · BBC {{ icon.codes }}</p>
      </article>
      {% endfor %}
    </div>
  </main>
</body>
</html>
