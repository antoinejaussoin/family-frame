# Copy to config.toml (gitignored) or point EINK_CONFIG at another file.

bind = "0.0.0.0:8765"
timezone = "Europe/London"
family_name = "Family"
# Display mode: "dashboard" (calendars & house) or "picture" (photo rotation).
# Switch from the family UI at http://<host>:8765/ — no restart needed.
mode = "dashboard"
# Birthdays live here, not on a calendar. Each entry is `Name,YYYY-MM-DD`.
# Merged into Today / Coming next up to two weeks ahead as “Name turns N”.
birthdays = ["Maya,2018-03-15", "Sam,2015-11-02"]
# Seconds the Pico should sleep between polls when `schedule_kind` is "interval".
# Top-level values are the *dashboard* schedule. Picture mode can override
# them under `[pictures]` (the family UI edits each mode separately).
poll_interval_secs = 3600
# Optional local times (HH:MM in `timezone`). Used when `schedule_kind` is "times".
# Both this list and `poll_interval_secs` are kept so you can switch between them.
# A single list applies every day:
# wake-up = ["06:00", "07:00", "08:30", "15:00", "23:15"]
# Or set each weekday (Mon–Sun). Omit a day to skip it (the frame sleeps until
# the next day that has a time). A day may also be a single "HH:MM" string.
# [wake-up]
# mon = ["06:30", "07:45", "15:30"]
# tue = ["06:30", "07:45", "15:30"]
# wed = ["06:30", "07:45", "15:30"]
# thu = ["06:30", "07:45", "15:30"]
# fri = ["06:30", "07:45", "15:30"]
# sat = ["08:00"]
# sun = ["08:00"]
# "interval" (every N seconds) or "times" (the wake-up list). Omitted: times
# if `wake-up` is non-empty, otherwise interval.
# schedule_kind = "interval"
# Fractional Pico timer error vs wall clock, written automatically from
# consecutive timer polls (not buttons). Positive = woke late. Capped at ±5%.
# pico_drift = 0.0
# 1S LiPo nameplate and the VSYS millivolts treated as 0% usable.
# battery_mah = 10000
# battery_empty_mv = 3300

# Optional Chromium / Chrome binary. Leave empty to auto-detect
# google-chrome / chromium on PATH, or the usual macOS .app paths.
chrome_path = ""

[pictures]
# Ordered picture ids (from the family UI uploads under pictures/).
# Required non-empty when mode = "picture".
rotate = []
# Optional picture-mode schedule. Omitted: same as the dashboard values above.
# poll_interval_secs = 600
# wake-up = []
# schedule_kind = "interval"

[todoist]
# Personal API token from Todoist → Settings → Integrations → Developer.
# Leave empty to show the built-in demo to-do list.
token = ""
# Shared project name or id. Invite the family to this project.
project = "Family"

[meross]
# Meross app email + password. MS100 sensors report through the hub;
# MTS200 wall thermostats are Wi-Fi devices on the same account.
email = ""
password = ""
# Leave empty unless the Meross app asks for a one-time code.
mfa_code = ""
api_base_url = "https://iotx-eu.meross.com"
country_code = "GB"
# Optional LAN IPs of the hub (tried before MQTT).
hub_hosts = []
# Optional display order / filter (Meross name or label). Empty = all rooms.
rooms = []

# “Kitchen Thermostat” is shortened to Kitchen. Override other names here:
# [meross.labels]
# "Sensor living room" = "Living room"
# "Hall TRV" = "Hall"

[weather]
# GeoNames id from the BBC Weather page URL:
# https://www.bbc.co.uk/weather/2643743  →  2643743
# Leave empty to show the built-in demo forecast.
location_id = "2643743"

[sources]
# Public ICS URLs (no password). Calendar.app’s webcal:// links
# are fine — they are fetched as https://. Publish a read-only
# family calendar from Calendar.app and paste the link here.
# A leftover [icloud] table in an old config.toml is ignored.
ics_urls = []

[pronote]
# Direct PRONOTE space URL (the eleve.html or parent.html page), not an ENT
# portal. Index Education’s public demo:
#   https://demo.index-education.net/pronote/eleve.html
#   username demonstration / password pronotevs
# Leave url empty to show the built-in demo school list.
url = ""
username = ""
password = ""
# "eleve" or "parent". Empty = infer from the URL.
account = ""
# Parent accounts: child’s name as Pronote shows it. Empty = first child.
child = ""
# First name on Today / next school day (“School: Léa (finishes at 16:30)”).
student = ""
# Optional 2FA PIN if Pronote asks for one.
pin = ""
