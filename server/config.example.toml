# Copy to config.toml (gitignored) or point EINK_CONFIG at another file.

bind = "0.0.0.0:8765"
timezone = "Europe/London"
family_name = "Family"
# Display mode: "dashboard" (calendars & house) or "picture" (photo rotation).
# Switch from the family UI at http://<host>:8765/ — no restart needed.
mode = "dashboard"
# Birthdays live here, not on a calendar. Each entry is `Name,YYYY-MM-DD`.
# Merged into Today / Coming next up to two weeks ahead as “Name turns N”.
birthdays = ["Maya,2018-03-15", "Sam,2015-11-02"]
# Seconds the Pico should sleep between polls when `wake-up` is empty.
# Top-level values are the *dashboard* schedule. Picture mode can override
# them under `[pictures]` (the family UI edits each mode separately).
poll_interval_secs = 3600
# Optional local times (HH:MM in `timezone`). If this list has at least one
# entry, the server tells the Pico how many seconds to sleep until the next one.
# wake-up = ["06:00", "07:00", "08:30", "15:00", "23:15"]

# Optional Chromium / Chrome binary. Leave empty to auto-detect
# google-chrome / chromium on PATH, or the usual macOS .app paths.
chrome_path = ""

[pictures]
# Ordered picture ids (from the family UI uploads under pictures/).
# Required non-empty when mode = "picture".
rotate = []
# Optional picture-mode schedule. Omitted: same as the dashboard values above.
# poll_interval_secs = 600
# wake-up = []

[icloud]
# Apple Account email + an *app-specific* password from
# https://account.apple.com (not your normal Apple ID password).
# Leave both empty to use the built-in demo calendar.
apple_id = ""
app_password = ""
# Display names as they appear in Calendar.app.
# Family Sharing calendars show up over CalDAV like any other calendar.
calendars = ["Family"]

[todoist]
# Personal API token from Todoist → Settings → Integrations → Developer.
# Leave empty to show the built-in demo to-do list.
token = ""
# Shared project name or id. Invite the family to this project.
project = "Family"

[meross]
# Meross app email + password. MS100 sensors report through the hub;
# MTS200 wall thermostats are Wi-Fi devices on the same account.
email = ""
password = ""
# Leave empty unless the Meross app asks for a one-time code.
mfa_code = ""
api_base_url = "https://iotx-eu.meross.com"
country_code = "GB"
# Optional LAN IPs of the hub (tried before MQTT).
hub_hosts = []
# Optional display order / filter (Meross name or label). Empty = all rooms.
rooms = []

# “Kitchen Thermostat” is shortened to Kitchen. Override other names here:
# [meross.labels]
# "Sensor living room" = "Living room"
# "Hall TRV" = "Hall"

[weather]
# GeoNames id from the BBC Weather page URL:
# https://www.bbc.co.uk/weather/2643743  →  2643743
# Leave empty to show the built-in demo forecast.
location_id = "2643743"

[sources]
# Extra public ICS URLs (no password). Calendar.app’s webcal:// links
# are fine — they are fetched as https://. Useful if you publish the
# family calendar as a read-only link instead of using CalDAV.
ics_urls = []
