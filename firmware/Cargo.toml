[package]
name = "family-frame-fw"
# Placeholder: the real version is the repo-root VERSION file, via build.rs.
version = "0.0.0"
edition = "2024"
publish = false
description = "Pico LiPo 2 XL W client: USB-provisioned Wi-Fi, POST /api/frame.bin, Inky Impression 13.3″"

[lib]
name = "family_frame_fw"
path = "src/lib.rs"

[[bin]]
name = "family-frame"
path = "src/main.rs"

[[bin]]
name = "family-frame-oled"
path = "src/main.rs"
required-features = ["oled-debug"]

[features]
default = []
oled-debug = ["dep:oled-i2c", "dep:embedded-graphics"]

[dependencies]
heapless = "0.8.0"

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
cyw43 = "0.7.0"
cyw43-pio = "0.10.0"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
    "tcp",
    "dhcpv4",
    "dns",
    "proto-ipv4",
    "medium-ethernet",
] }
# Pico LiPo 2 XL W: RP2350B (`rp235xb`), 16 MB flash, GP47 PSRAM, RM2 / CYW43439.
embassy-rp = { version = "0.10.0", features = [
    "rp235xb",
    "time-driver",
    "critical-section-impl",
    "binary-info",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-graphics = { version = "0.8.1", optional = true }
embedded-io-async = "0.7.0"
oled-i2c = { version = "0.3.0", optional = true, features = ["embedded-graphics"] }
panic-halt = "1.0.0"
portable-atomic = { version = "1.11.0", features = ["critical-section"] }
static_cell = "2.1.1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
debug = true
