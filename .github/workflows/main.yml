name: Main Build

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read VERSION
        id: package
        run: echo "content=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.content }}
      - name: Setup BuildX
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push server
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          file: server/Dockerfile
          context: server
          tags: antoinejaussoin/family-frame-server:latest,antoinejaussoin/family-frame-server:${{ steps.package.outputs.content }}
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=family-frame-server
          cache-to: type=gha,mode=max,scope=family-frame-server
