name: Main Build

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read VERSION
        id: package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'; then
            echo "VERSION must be semver (got '$VERSION')" >&2
            exit 1
          fi
          echo "content=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.content }}
      - name: Setup BuildX
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push server
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          file: server/Dockerfile
          context: server
          build-args: |
            VERSION=${{ steps.package.outputs.content }}
          tags: antoinejaussoin/family-frame-server:latest,antoinejaussoin/family-frame-server:${{ steps.package.outputs.content }}
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=family-frame-server
          cache-to: type=gha,mode=max,scope=family-frame-server
      - name: Tag v${{ steps.package.outputs.content }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.package.outputs.content }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
