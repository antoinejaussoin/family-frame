name: Main Build

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  IMAGE: antoinejaussoin/family-frame-server

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.package.outputs.content }}
    steps:
      - uses: actions/checkout@v7
      - name: Read VERSION
        id: package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'; then
            echo "VERSION must be semver (got '$VERSION')" >&2
            exit 1
          fi
          echo "content=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.content }}

  server:
    name: server (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Prepare cache scope
        run: |
          if [ "${{ matrix.platform }}" = "linux/amd64" ]; then
            echo "CACHE_SCOPE=family-frame-server" >> "$GITHUB_ENV"
          else
            platform="${{ matrix.platform }}"
            echo "CACHE_SCOPE=family-frame-server-${platform//\//-}" >> "$GITHUB_ENV"
          fi
      - name: Setup BuildX
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push server
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          file: server/Dockerfile
          context: server
          build-args: |
            VERSION=${{ needs.version.outputs.content }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'linux-amd64' || 'linux-arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: [version, server]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Setup BuildX
        uses: docker/setup-buildx-action@v4
      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="${{ needs.version.outputs.content }}"
          digests=(*)
          if [ ${#digests[@]} -eq 0 ]; then
            echo "No image digests downloaded" >&2
            exit 1
          fi
          args=()
          for digest in "${digests[@]}"; do
            args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${args[@]}"
      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ needs.version.outputs.content }}"
      - uses: actions/checkout@v7
      - name: Tag v${{ needs.version.outputs.content }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.version.outputs.content }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
