name: PR Build Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: server
        run: cargo test --features watch
      - name: cargo check without Pronote/Meross
        working-directory: server
        run: cargo check --no-default-features --features watch

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read VERSION
        id: package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'; then
            echo "VERSION must be semver (got '$VERSION')" >&2
            exit 1
          fi
          echo "content=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Setup BuildX
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Build server
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          file: server/Dockerfile
          context: server
          build-args: |
            VERSION=${{ steps.package.outputs.content }}
          tags: family-frame-server:pr-${{ github.event.pull_request.number }}
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=family-frame-server
          cache-to: type=gha,mode=max,scope=family-frame-server
